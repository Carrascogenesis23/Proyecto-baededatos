<!DOCTYPE html>
<html>
<head>
    <title>Registro Estudiante</title>
</head>
<body>

<h1>Registro de Estudiante</h1>

<form method="POST">

    <input type="text" name="nombre1" placeholder="Primer nombre" required><br><br>

    <input type="text" name="nombre2" placeholder="Segundo nombre"><br><br>

    <input type="text" name="apellido1" placeholder="Primer apellido" required><br><br>

    <input type="text" name="apellido2" placeholder="Segundo apellido"><br><br>

    <input type="email" name="correo" placeholder="Correo" required><br><br>

    <input type="number" name="universidad" placeholder="ID Universidad" required><br><br>

    <input type="number" name="carrera" placeholder="ID Carrera" required><br><br>

    <input type="number" name="nivel" placeholder="ID Nivel" required><br><br>

    <input type="number" step="0.01" name="indice" placeholder="Índice Académico" required><br><br>

    <button type="submit">
        Registrar
    </button>

</form>

</body>
